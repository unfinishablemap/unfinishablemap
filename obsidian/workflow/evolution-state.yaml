    THE LENS -- SAME QUOTATION, DIFFERENT WORDING, ACROSS FILES. Third sibling of
    the

    run-922 page-range and run-923 year lenses, moved off the reference apparatus
    and

    onto BODY PROSE. Extract every double-quoted span from obsidian/{topics,concepts,

    apex,voids,positions,research} plus archive/, FRONTMATTER STRIPPED FIRST (per

    content-metrics-must-strip-frontmatter-first -- unstripped, quoted wikilinks and

    title/description dominate the output and the lens measures nothing), normalise

    (wikilink and md-link labels unwrapped, emphasis stripped, case and punctuation

    folded), keep spans >= 8 words, index by 5-word shingles, and report pairs sharing

    >= 2 shingles with difflib ratio in [0.80, 1.0). 12,813 spans, 366 near-identical

    divergent families. Filtering to families where no variant is a SUBSTRING of another

    (a substring is an excerpt, not a divergence) leaves 192 genuine word-substitution

    families. The lens needs NO web budget to find candidates: internal divergence

    proves at least one locus is non-verbatim on its own.


    WHAT SURVIVED, AND WHY THESE TWO.

    (1) TENET-2 SELF-MISQUOTE -- the strongest single finding of the last four runs.

    Four live articles, two served archive bodies and one research note put "the

    smallest possible non-physical influence on quantum outcomes" inside quotation

    marks and attribute it to Tenet 2. tenets.md L62 reads PHYSICAL outcomes and

    git log -S over every revision of tenets/tenets.md returns ZERO commits ever

    introducing the quantum form -- so this is NOT stale-but-once-correct drift, it
    is

    a fabricated quotation of the Maps own tenet. Two aggravators make it a lens defect

    rather than seven typos: deep-review-2026-07-15-interface-heterogeneity ran an

    explicit Quote-Fidelity Lens, reached the exact string, and EXEMPTED it for being
    a

    self-quote (the self-quotation sibling of quote-aggregator-ratification-corrupts-

    verbatim -- inspected and blessed, not missed); and CLAUDE.md L394 carries the
    wrong

    form, so every agent that reads the instruction file reproduces it. Task scoped
    to

    the seven QUOTED loci plus CLAUDE.md L394, and explicitly FORBIDS sweeping the
    nine

    unquoted paraphrases -- Tenet 2s own Definition says "at the quantum level", so
    the

    paraphrase is faithful to the tenets content and only the quotation marks create
    a

    defect. tenets.md itself must not be edited (tenet amendment is an operator call).

    (2) RESEARCH-AND-ARCHIVE QUOTE RESIDUE -- six canonical quotations (Hume, Wheeler,

    Nisbett and Wilson, Schwitzgebel, McGinn, Wittgenstein PI 272), ~20 quoted loci,
    all

    in obsidian/research/ or archive/, all with the correct form ALREADY publisher-

    verified in a named in-repo review file, so zero web budget is needed. One mechanism:

    a deep-review corrects the file it was pointed at, the live tree ends clean, and
    the

    string survives in the research note that seeded it and the archived body that

    inherited it -- fix-by-file-leaves-string-siblings-live at corpus scale. Worst
    locus

    is a fabricated quote FRAME (three words of invented preamble inside the quotation

    marks). Notable sub-finding: the Schwitzgebel family is a HOUSE-STYLE mechanism,
    not

    typos -- British spelling normalisation crossed into verbatim quotes from a US

    author, and the same research note keeps the correct spelling in its Quote field

    while Britishising the prose restatement.


    FALSE-POSITIVE CLASSES RECORDED IN THE TASK NOTES so the next run does not re-chase

    them. (i) RIVAL PAPERS WITH DELIBERATELY OPPOSED TITLES -- concepts/local-tomography

    carries "can be experimentally falsified" (Renou 2021 Nature) at L32 and "cannot
    be

    experimentally falsified" (Hoffreumon and Woods 2026) at L34. This was the most

    alarming-looking hit in the entire scan and is entirely correct; the 2026 paper
    is a

    rebuttal that inverts the 2021 title on purpose. Caught only by opening the file
    --

    exactly replenish-asserted-concrete-defect-often-false. (ii) SHORTER EXCERPTS
    of the

    same quote. (iii) EDITIONS AND TRANSLATIONS, carried over from run 923.

    ALSO DEDUPED, NOT MINTED: the Carroll-regress variants (concepts/carrolls-regress
    vs

    voids/inference-void) are already owned by an open P3 at line 2003; found by grepping

    open task NOTES rather than titles, the same discipline that caught run 923s

    O Brien-Kop duplicate.


