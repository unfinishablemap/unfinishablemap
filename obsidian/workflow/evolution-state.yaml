    discriminating question is whether the two years denote DIFFERENT PUBLICATION
    EVENTS

    of the same work (legitimate) or the SAME event dated two ways (defect). One key

    collision also surfaced: Bayne and Chalmers 2003 "What is the unity of consciousness?"

    collided with Bayne 2010 "The Unity of Consciousness" -- genuinely different works.


