    vetoed work. staleness / orphan_integration: not reached, floor already restored.


    MINT ONE, refine-draft: archive/concepts/minimal-consciousness.md (plus

    archive/concepts/metarepresentation.md). THE ARCHIVE TREE IS THE FINDING HERE,

    not the individual defect. Commits c8937bdef, 61184499b and 189653291 each

    closed a tranche of the retired flat ape-gap claim on 2026-08-01 and each

