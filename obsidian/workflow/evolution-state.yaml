    unconsumed_research: EXHAUSTED, both 2026-07-31/08-01 notes consumed as above.

    gap_analysis / expand-topic: DECLINED on caps - topics/ 318 of 320, concepts/

    318 of 320, voids/ 100 of 100. Two slots each in topics and concepts is real

    headroom under the skill''s own rule, but with no research note to consume, a

    freshly invented candidate would spend a scarce slot on filler; same call runs

    910-912 made. positions/ is 11 of 80 and has ample headroom, but four

    positions-evolve tasks are already open at P3 and the skill caps adds at 2 per

    run as deliberate friction. length_analysis: DECLINED. get_length_warnings

    returns 90 hard-or-worse entries, but the top of that list is research notes and

    positions register files, which are aggregate documents rather than articles and

    are not condense targets, and the three condense tasks previously minted from

