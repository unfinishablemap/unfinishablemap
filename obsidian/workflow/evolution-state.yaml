    THE DOMINANT FALSE-POSITIVE CLASS IS EDITIONS AND TRANSLATIONS -- RECORD IT, it
    is

    most of the 90. Legitimate divergences seen: Husserl 1928/1991 (Brough trans.),

    Bergson 1889/1910 (Pogson trans.), Merleau-Ponty 1945/1962, Wittgenstein 1921/1922

    (Ogden trans.), Stapp Mindful Universe 2007/2011 (1st/2nd ed.), Kastner 2012/2022

    (1st/2nd ed.), Gallagher and Zahavi 2012/2020 (2nd/3rd ed.), Strawson 1994/2010,

